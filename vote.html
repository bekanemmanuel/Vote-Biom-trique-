<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élections Côte d'Ivoire · Biométrie Native</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Styles conservés de ton original pour le design */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f4f7fc; color: #1e293b; padding: 1.5rem 1rem; }
    .flag-strip { display: flex; height: 8px; width: 100%; max-width: 1200px; margin: 0 auto 1.5rem; border-radius: 20px; overflow: hidden; }
    .flag-orange { background: #F77F00; flex: 1; }
    .flag-white { background: #FFFFFF; flex: 1; }
    .flag-green { background: #009E60; flex: 1; }
    .app-container { max-width: 1200px; width: 100%; background: white; border-radius: 30px; margin: 0 auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 2rem; }
    .header-title { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .header-icon { background: #F77F00; color: white; width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .subtitle { color: #64748b; font-weight: 500; border-left: 4px solid #009E60; padding-left: 15px; margin-bottom: 30px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { background: none; border: none; padding: 10px 20px; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 10px; transition: 0.3s; white-space: nowrap; }
    .tab-btn.active { background: #F77F00; color: white; }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .form-card { background: #fafafa; border: 1px solid #e2e8f0; border-radius: 20px; padding: 20px; }
    .field-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; }
    input:focus { border-color: #F77F00; }
    .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: #F77F00; color: white; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .fingerprint-area { background: #fff; border: 2px dashed #cbd5e1; border-radius: 15px; padding: 20px; text-align: center; margin: 15px 0; }
    .fingerprint-icon.scanned { color: #009E60; }
    .list-container { max-height: 250px; overflow-y: auto; background: white; border-radius: 12px; margin-top: 10px; }
    .list-item { padding: 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
    .candidate-option { display: flex; align-items: center; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; cursor: pointer; }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
    .toast { background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 10px; border-left: 5px solid #F77F00; }
  </style>
</head>
<body>
<div id="toastContainer" class="toast-container"></div>
<div class="flag-strip"><div class="flag-orange"></div><div class="flag-white"></div><div class="flag-green"></div></div>

<div class="app-container">
  <div class="header-title">
    <div class="header-icon"><i class="fas fa-fingerprint"></i></div>
    <h1>Élections Côte d'Ivoire</h1>
  </div>
  <div class="subtitle">Sécurisé par Biométrie Native</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="enrolment">Enrôlement</button>
    <button class="tab-btn" data-tab="candidates">Candidats</button>
    <button class="tab-btn" data-tab="voting">Vote</button>
    <button class="tab-btn" data-tab="results">Résultats</button>
  </div>

  <div id="panel-enrolment" class="panel active">
    <div class="card-grid">
      <div class="form-card">
        <h3>Nouvel Électeur</h3>
        <div class="field-group"><label>Nom & Prénoms</label><input type="text" id="voterName" placeholder="Konan Kouassi"></div>
        <div class="field-group"><label>N° CNI / Passeport</label><input type="text" id="voterID" placeholder="CI00123456"></div>
        <div class="fingerprint-area">
          <div class="fingerprint-icon" id="enrolIcon"><i class="fas fa-fingerprint" style="font-size:40px;"></i></div>
          <p id="enrolStatus">Empreinte non enregistrée</p>
          <button class="btn btn-secondary" id="btnScanEnrol" style="margin-top:10px;">Scanner mon doigt</button>
        </div>
        <button class="btn btn-primary" id="btnSaveVoter" style="width:100%; justify-content:center;">Enregistrer l'électeur</button>
      </div>
      <div class="form-card">
        <h3>Liste des enrôlés</h3>
        <div id="voterList" class="list-container"></div>
      </div>
    </div>
  </div>

  <div id="panel-voting" class="panel">
    <div class="card-grid">
      <div class="form-card">
        <h3>Identification</h3>
        <div class="field-group"><label>Entrez votre N° CNI</label><input type="text" id="voterCheckID"></div>
        <div class="fingerprint-area">
          <div class="fingerprint-icon" id="voteIcon"><i class="fas fa-fingerprint" style="font-size:40px;"></i></div>
          <p id="voteStatus">Prêt pour authentification</p>
          <button class="btn btn-secondary" id="btnScanVote" style="margin-top:10px;">Vérifier mon empreinte</button>
        </div>
      </div>
      <div class="form-card">
        <h3>Bulletin de Vote</h3>
        <div id="ballotBox">Identifiez-vous avec votre empreinte pour voter</div>
      </div>
    </div>
  </div>

  <div id="panel-candidates" class="panel">
    <div class="form-card">
      <h3>Ajouter un Candidat</h3>
      <input type="text" id="candName" placeholder="Nom">
      <input type="text" id="candParty" placeholder="Parti" style="margin-top:10px">
      <button class="btn btn-primary" id="btnSaveCand" style="margin-top:10px">Ajouter</button>
      <div id="candList" class="list-container"></div>
    </div>
  </div>
  <div id="panel-results" class="panel"><div id="resultsContent" class="form-card"></div></div>
</div>

<script>
  // --- UTILS : Conversion pour WebAuthn ---
  const bufferToBase64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const base64ToBuffer = (base64) => Uint8Array.from(atob(base64), c => c.charCodeAt(0));

  let db = {
    voters: JSON.parse(localStorage.getItem('ci_voters')) || [],
    candidates: JSON.parse(localStorage.getItem('ci_candidates')) || [],
    votes: JSON.parse(localStorage.getItem('ci_votes')) || []
  };

  let currentTempCredId = null;
  let identifiedVoter = null;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // --- LOGIQUE CORE : WebAuthn ---
  async function registerBiometric(username) {
    const challenge = window.crypto.getRandomValues(new Uint8Array(32));
    const userId = window.crypto.getRandomValues(new Uint8Array(16));

    const options = {
      publicKey: {
        challenge,
        rp: { name: "E-Election CI", id: window.location.hostname || "localhost" },
        user: { id: userId, name: username, displayName: username },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000
      }
    };

    try {
      const cred = await navigator.credentials.create(options);
      return bufferToBase64(cred.rawId);
    } catch (err) {
      console.error(err);
      toast("Erreur ou annulation");
      return null;
    }
  }

  async function verifyBiometric(storedCredIdBase64) {
    const challenge = window.crypto.getRandomValues(new Uint8Array(32));
    const credIdBuffer = base64ToBuffer(storedCredIdBase64);

    const options = {
      publicKey: {
        challenge,
        allowCredentials: [{ id: credIdBuffer, type: 'public-key' }],
        userVerification: "required",
        timeout: 60000
      }
    };

    try {
      const assertion = await navigator.credentials.get(options);
      return !!assertion;
    } catch (err) {
      console.error(err);
      toast("Vérification échouée");
      return false;
    }
  }

  // --- EVENEMENTS ---

  // Scanner (Enrôlement)
  document.getElementById('btnScanEnrol').addEventListener('click', async () => {
    const name = document.getElementById('voterName').value;
    if (!name) return toast("Entrez un nom d'abord");
    
    const credId = await registerBiometric(name);
    if (credId) {
      currentTempCredId = credId;
      document.getElementById('enrolStatus').innerText = "Empreinte liée !";
      document.getElementById('enrolIcon').classList.add('scanned');
      toast("Scan réussi");
    }
  });

  // Sauvegarder Électeur
  document.getElementById('btnSaveVoter').addEventListener('click', () => {
    const name = document.getElementById('voterName').value;
    const id = document.getElementById('voterID').value;
    if (!name || !id || !currentTempCredId) return toast("Données incomplètes");

    db.voters.push({ name, id, credId: currentTempCredId });
    localStorage.setItem('ci_voters', JSON.stringify(db.voters));
    renderLists();
    toast("Électeur enregistré !");
    // Reset
    currentTempCredId = null;
    document.getElementById('voterName').value = "";
    document.getElementById('voterID').value = "";
    document.getElementById('enrolIcon').classList.remove('scanned');
  });

  // Vérifier pour Voter
  document.getElementById('btnScanVote').addEventListener('click', async () => {
    const idInput = document.getElementById('voterCheckID').value;
    const voter = db.voters.find(v => v.id === idInput);
    
    if (!voter) return toast("Numéro CNI non trouvé");

    const success = await verifyBiometric(voter.credId);
    if (success) {
      identifiedVoter = voter;
      document.getElementById('voteStatus').innerText = "Votant : " + voter.name;
      document.getElementById('voteIcon').classList.add('scanned');
      renderBallot();
    }
  });

  // Navigation & Listes
  function renderLists() {
    document.getElementById('voterList').innerHTML = db.voters.map(v => `<div class="list-item"><span>${v.name}</span> <small>${v.id}</small></div>`).join('');
  }

  function renderBallot() {
    const box = document.getElementById('ballotBox');
    if(db.votes.find(v => v.voterId === identifiedVoter.id)) {
        box.innerHTML = "<b>Vous avez déjà voté.</b>";
        return;
    }
    box.innerHTML = db.candidates.length > 0 
      ? db.candidates.map(c => `<div class="candidate-option" onclick="castVote(${c.id})"><b>${c.name}</b> (${c.party})</div>`).join('')
      : "Aucun candidat disponible.";
  }

  window.castVote = (candId) => {
    db.votes.push({ voterId: identifiedVoter.id, candId });
    localStorage.setItem('ci_votes', JSON.stringify(db.votes));
    toast("Vote confirmé !");
    document.getElementById('ballotBox').innerHTML = "Merci pour votre geste citoyen.";
    identifiedVoter = null;
  };

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn, .panel').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('btnSaveCand').addEventListener('click', () => {
    db.candidates.push({ name: document.getElementById('candName').value, party: document.getElementById('candParty').value, id: Date.now() });
    localStorage.setItem('ci_candidates', JSON.stringify(db.candidates));
    toast("Candidat ajouté");
  });

  renderLists();
</script>
</body>
</html>
